<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#FF5C8A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English Squish">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>English Squish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@700;800&display=swap">
<style>
/* Layout: samme lekesøyle som Lesesquish; tykke trykk-brikker; lytt først, så svar */
:root{
  --bg:#EDF0FF; --paper:#FFFFFF; --fg:#26214A; --muted:#67638C;
  --accent:#FF5C8A; --star:#F5A800; --good:#1F9D63; --bad:#E5484D;
  --line:#CDD3F3; --locked:#DCE0F5; --tile:#FFFFFF; --tile-edge:#C3C9EC; --soft:#E2E6FF; --en:#3D7BFF;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Verdana","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17152B; --paper:#221F3D; --fg:#F2F0FF; --muted:#A9A5CF;
  --accent:#FF7AA2; --star:#FFC83D; --good:#3DD68C; --bad:#FF6B6F;
  --line:#3A3664; --locked:#34305A; --tile:#2C2850; --tile-edge:#0F0D20; --soft:#2A2650; --en:#7FA8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17152B; --paper:#221F3D; --fg:#F2F0FF; --muted:#A9A5CF;
  --accent:#FF7AA2; --star:#FFC83D; --good:#3DD68C; --bad:#FF6B6F;
  --line:#3A3664; --locked:#34305A; --tile:#2C2850; --tile-edge:#0F0D20; --soft:#2A2650; --en:#7FA8FF; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--read);font-size:17px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

.bar{display:flex;align-items:center;gap:10px}
.bar h1{font-size:30px;flex:1;letter-spacing:.5px}
.bar h1 span{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--tile-edge)}
.pill svg{width:22px;height:22px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--tile-edge)}
.icon-btn svg{width:24px;height:24px}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--good)}
.dots i.now{background:var(--accent);transform:scale(1.25)}

.progress{background:var(--paper);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress h2{font-size:20px}
.progress small{color:var(--muted);font-size:15px}
.meter{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter b{display:block;height:100%;background:var(--star);border-radius:99px;transition:width .5s}
.gift-cta{display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:18px;padding:12px 16px;font-family:var(--display);font-size:20px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);animation:wiggle 1.6s infinite}
.gift-cta svg{width:44px;height:44px;flex:none}

.label{font-family:var(--display);font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--tile);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--tile-edge);transition:transform .08s}
.mode:active,.tile:active,.btn:active,.mic:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tile-edge)}
.mode .glyph{font-family:var(--read);font-weight:700;font-size:30px;line-height:1;height:40px;display:flex;align-items:center;gap:6px}
.mode .glyph small{font-size:22px}
.mode h3{font-size:18px}
.mode p{font-size:14px;color:var(--muted)}
.m1 .glyph{color:#3D7BFF}.m2 .glyph{color:#14A88A}.m3 .glyph{color:var(--accent)}.m4 .glyph{color:#C27C00}
:root[data-theme="dark"] .m4 .glyph{color:var(--star)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .m4 .glyph{color:var(--star)}}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--paper);font-weight:700;box-shadow:0 3px 0 var(--tile-edge);font-size:15px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:12px 18px;border-radius:16px;background:var(--paper);font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--tile-edge);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:24px;height:24px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.small{font-family:var(--read);font-weight:700;font-size:15px;padding:9px 14px}
.btn.wide{width:100%}
.btn.soft{background:var(--soft);box-shadow:none}

.stage{background:var(--paper);border-radius:26px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ask{font-family:var(--display);font-size:22px}
.eng{font-family:var(--read);font-weight:700;font-size:24px;color:var(--en)}
.pic{font-size:96px;line-height:1.05;user-select:none;display:grid;place-items:center;min-height:100px}
.hear{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.speak{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.speak svg{width:42px;height:42px}
.speak.sm{width:52px;height:52px}.speak.sm svg{width:26px;height:26px}
.slow{width:52px;height:52px;border-radius:50%;background:var(--soft);font-size:28px;display:grid;place-items:center}
.fb{min-height:26px;font-weight:700;font-size:19px;color:var(--good)}
.fb .no{color:var(--muted);font-weight:400}
.opts{display:grid;gap:12px}
.opts.four{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--tile);border-radius:20px;box-shadow:0 5px 0 var(--tile-edge);font-family:var(--read);font-weight:700;font-size:58px;min-height:96px;display:grid;place-items:center;transition:transform .08s,background .2s;min-width:0}
.tile.lab{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 6px;font-size:46px;min-height:118px}
.tile.lab span.t{font-size:15px;line-height:1.2;color:var(--muted);text-wrap:balance}
.tile.lab span.t.big{font-size:22px;color:var(--fg)}
.tile.ok{background:var(--good);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--good) 55%,#000);animation:pop .4s}
.tile.ok span.t{color:#fff}
.tile.no{opacity:.35;animation:shake .4s}
.tile:disabled{cursor:default}
.sw{display:inline-block;width:64px;height:64px;border-radius:50%;border:3px solid rgba(0,0,0,.15)}
.pic .sw{width:96px;height:96px}
.num{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.pic .num{font-size:110px;color:var(--en)}
.nw{font-family:var(--display);font-size:24px;line-height:1.15;color:var(--fg);text-wrap:balance;padding:0 6px;overflow-wrap:anywhere}
.pic .nw{font-size:clamp(34px,10vw,48px);display:inline-block;background:var(--soft);border-radius:18px;padding:14px 22px}
.practised{font-size:15px;color:var(--muted)}

/* lytt og svar */
.qbox{width:100%;box-sizing:border-box;background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.qbox .row{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.qno{font-size:17px;color:var(--muted)}
.storytext{width:100%;box-sizing:border-box;text-align:left;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:18px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.storytext .en{color:var(--en);font-weight:700}
.storytext .nor{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* si det */
.mic{width:110px;height:110px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.mic svg{width:52px;height:52px}
.mic.on{background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 50%,transparent);animation:pulse 1.2s infinite}
.status{min-height:24px;font-size:17px;color:var(--muted)}
.status b{color:var(--fg)}
.hintword{font-family:var(--read);font-weight:700;font-size:40px;color:var(--en)}

.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.bigstars{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bigstars svg{width:40px;height:40px}
.gift{width:200px;height:200px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.gift svg{width:100%;height:100%}
.gift.shake{animation:giftshake .45s}
.taps{display:flex;gap:10px}.taps i{width:16px;height:16px;border-radius:50%;background:var(--line)}.taps i.on{background:var(--accent)}
.reveal{position:relative;display:grid;place-items:center;width:240px;height:240px}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--star) 45%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.sq-big{position:relative;width:200px;height:200px;animation:appear .6s cubic-bezier(.3,1.6,.5,1)}
.sq-big svg,.card svg{width:100%;height:100%;overflow:visible}
.rar{font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;background:var(--soft)}
.rar.r1{background:#D9E8FF;color:#1E4FB3}.rar.r2{background:#FFF0B3;color:#7A5500}
.squish{animation:squish .5s}

.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.card{background:var(--paper);border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .art{width:76px;height:76px}
.card span{font-size:13px;font-weight:700;line-height:1.2;text-align:center}
.card.locked span{color:var(--muted)}

.nospeech{background:var(--paper);border:2px dashed var(--accent);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.adultans{font-family:var(--read);font-weight:700;font-size:22px}
.voicebox select{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%;max-width:100%}
.voicenote b{color:var(--fg)}
.voicenote{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:16px;font-family:var(--display);font-size:18px;z-index:20;animation:up .3s;max-width:calc(100% - 48px);text-align:center}
.plus{position:fixed;font-family:var(--display);font-size:26px;color:var(--star);pointer-events:none;z-index:30;animation:float 1s forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:25;pointer-events:none;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes giftshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) scale(1.05)}50%{transform:rotate(9deg) scale(1.08)}80%{transform:rotate(-5deg)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.28,.72)}55%{transform:scale(.88,1.14)}75%{transform:scale(1.06,.95)}100%{transform:scale(1)}}
@keyframes appear{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
@keyframes float{to{transform:translateY(-60px);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

let AC = null;
function tone(f,d,type='sine',when=0,vol=.18,f2){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime+when, o = AC.createOscillator(), g = AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}

function rankVoice(v){
  let s; const n = v.name+' '+v.voiceURI;
  if(/^en[-_]GB/i.test(v.lang)) s=100; else if(/^en[-_]US/i.test(v.lang)) s=85; else if(/^en/i.test(v.lang)) s=70; else return -1;
  if(/natural|neural/i.test(n)) s+=60; if(/premium/i.test(n)) s+=50; if(/enhanced|forbedret/i.test(n)) s+=45;
  if(/online/i.test(n)) s+=30; if(/google/i.test(n)) s+=25; if(/compact|espeak/i.test(n)) s-=40;

const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked = !SRC, listening = false, REC = null, micErr = '';
// Lytter i opptil 8 sekunder: hvis mikrofonen slår seg av uten å ha hørt noe, starter den stille på nytt
let listenGen = 0;
function listen(onText, onFail, onPartial){
  if(!SRC){ micBlocked=true; onFail('none'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const gen = ++listenGen, t0 = Date.now(), heard = [];
  let done=false, round=0;
  const fin = (f,x)=>{ if(done) return; done=true; if(gen===listenGen) listening=false; f(x); };
  const startOne = ()=>{
    if(done) return;
    if(gen!==listenGen) return fin(onFail,'aborted');
    const first = round++===0;
    let r;
    try{
      r = new SRC();
      r.lang = VOICE && /^en/i.test(VOICE.lang) ? VOICE.lang : 'en-GB';
      r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
    }catch(e){ micErr='start: '+(e&&e.name||'error'); return fin(onFail, first?'not-allowed':'no-speech'); }
    r.onresult = e=>{ let final=false; const alts=[];
      for(const res of e.results){ for(let i=0;i<res.length;i++) alts.push(res[i].transcript); if(res.isFinal) final=true; }
      alts.forEach(a=>{ if(a && a.trim() && !heard.includes(a)) heard.push(a); });
      if(onPartial && !done && onPartial(heard)){ fin(onText, heard); try{ r.abort(); }catch(x){} return; }
      if(final && heard.length) fin(onText, heard); };
    r.onerror = e=>{
      const er = e.error||'error';
      if(er==='no-speech' || er==='aborted') return;          // håndteres i onend
      if(!first && er!=='audio-capture') return;               // omstart som feilet: behandles som stillhet
      micErr = er; fin(onFail, er); };
    r.onend = ()=>{
      if(done) return;
      if(heard.length) return fin(onText, heard);
      if(gen!==listenGen) return fin(onFail,'aborted');
      if(Date.now()-t0 < 8000) setTimeout(startOne, 120); else fin(onFail,'no-speech'); };
    REC=r;
    try{ r.start(); }catch(e){ micErr='start: '+(e&&e.name||'error'); fin(onFail, first?'not-allowed':'no-speech'); }
  };
  listening=true; startOne();
}

function lev(a,b){ const m=a.length,n=b.length; let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }

function pkey(w){
  w=(w||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return '';
  w=w.replace(/^kn/,'n').replace(/^wr/,'r').replace(/^wh/,'w').replace(/ph/g,'f').replace(/gh/g,'').replace(/ck/g,'k')
     .replace(/q/g,'k').replace(/x/g,'ks').replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/z/g,'s')
     .replace(/th/g,'t').replace(/sh|ch|tch/g,'s').replace(/dg/g,'j').replace(/v/g,'f').replace(/w/g,'u');
  if(w.length>3) w=w.replace(/e$/,'');
  w=w.replace(/[aeiouy]+/g,'a').replace(/(.)\1+/g,'$1');
  return w;
}
function soundsLike(said, target){
  const a=said.replace(/[^a-z0-9]/g,''), b=target.replace(/[^a-z0-9]/g,'');
  if(!a||!b) return false;
  if(a===b || SOUNDS[a]===b || (SOUNDS[a] && SOUNDS[a]===SOUNDS[b])) return true;
  const ka=pkey(a), kb=pkey(b);
  if(ka===kb) return true;
  // korte ord: b/p, d/t, g/k og f/v forveksles lett av talegjenkjenningen
  const soft = k => k.length<=3 ? k.replace(/^p/,'b').replace(/^t/,'d').replace(/^k/,'g').replace(/p$/,'b').replace(/t$/,'d').replace(/k$/,'g') : k;
  if(soft(ka)===soft(kb)) return true;
  if(ka[0]!==kb[0]) return false;
  const tol = kb.length<=3 ? (ka.slice(-1)===kb.slice(-1)?1:0) : kb.length<=6 ? 1 : 2;
  if(lev(ka,kb)<=tol) return true;
  return b.length>=5 && lev(a,b)<=Math.floor(b.length/4);
}
const tg = it => { const t=it[0].split('|').map(x=>norm(x).trim()).filter(Boolean); if(/^\d+$/.test(it[1])) t.push(it[1]); return t; };
const flat = s => s.replace(/[^a-z0-9]/g,'');
const STOP = new Set(['its','it','is','a','an','the','this','that','thats','i','im','am','are','my','number','colour','color','called','um','uh','er','eh','ehm','okay','ok','so','and','like']);
function heardIt(alts, it, pool){
  const targets = tg(it);
  // svar som er et annet ord i samme tema (Tuesday for Thursday, grey for green) godtas ikke
  const others = (pool||[]).filter(x=>x!==it).flatMap(tg).filter(o=>!targets.some(t=>flat(t)===flat(o)));
  return alts.some(a=>{ const A=norm(a), all=A.trim().split(' ').filter(Boolean);
    if(!all.length) return false;
    if(targets.some(t=>A.includes(' '+t+' '))) return true;
    return targets.some(t=>{
      const tw=t.split(' ').map(flat);
      const words=all.filter(w=>!STOP.has(flat(w)) || tw.includes(flat(w)));
      if(!words.length) return false;
      const n=t.split(' ').length;
      const wins=[]; for(let i=0;i+n<=words.length;i++) wins.push(words.slice(i,i+n).join(''));
      if(n>1){ wins.push(words.join('')); for(let i=0;i+n<=all.length;i++) wins.push(all.slice(i,i+n).join('')); }
      return wins.some(w=>{
        if(!soundsLike(w, t)) return false;
        const closer = others.some(o=>{ const fo=flat(o); return w===fo || pkey(w)===pkey(fo) || lev(pkey(w),pkey(fo)) < lev(pkey(w),pkey(flat(t))); });
        return !closer;
      });
    });
  });
}

function sqSVG(d, locked){
  const [shape, fy, top] = SHAPES[d.s];

  let acc = '', under = '', eye = ink, er = 4.6;
  const a = d.a;
  if(a==='leaf') acc += `<path style="fill:#4FB548;stroke:#2F8A33" stroke-width="2" d="M60 ${top+3}C57 ${top-8} 62 ${top-15} 73 ${top-17}C74 ${top-7} 69 ${top-1} 60 ${top+3}Z"/>`;
  if(a==='bow') acc += `<g style="fill:#FF5C8A;stroke:#C93A66" stroke-width="2" stroke-linejoin="round"><path d="M84 ${top+6}L70 ${top-4}L72 ${top+16}Z"/><path d="M84 ${top+6}L98 ${top-4}L96 ${top+16}Z"/><circle cx="84" cy="${top+6}" r="4.5"/></g>`;

  if(a==='spots') acc += [[38,fy+22,7],[84,fy+18,5],[70,fy+30,4]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" style="fill:${shade(c,.82)}"/>`).join('');
  if(a==='cow') acc += `<path style="fill:${ink}" d="M24 70q8-14 18-6t-4 16q-12 2-14-10z"/><path style="fill:${ink}" d="M80 86q10-8 18 0t-6 12q-12 0-12-12z"/><ellipse cx="62" cy="48" rx="7" ry="5" style="fill:${ink}"/>`;
  if(a==='seeds') acc += [[44,58],[76,58],[36,88],[84,88],[60,96],[50,46],[70,46]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.8" ry="3" style="fill:#FFF3B0"/>`).join('') + `<path style="fill:#4FB548;stroke:#2F8A33" stroke-width="2" stroke-linejoin="round" d="M60 18L48 6L58 10L60 0L62 10L72 6Z"/>`;
  if(a==='sprinkles'){ const col=['#FF5C8A','#3D7BFF','#FFC83D','#1FBF8F','#A06BFF'];
    acc += [[36,52,30],[48,44,-20],[66,42,60],[80,50,10],[90,62,-40],[30,66,70],[58,50,-60],[74,58,35]].map(([x,y,r],i)=>`<rect x="${x-4}" y="${y-1.6}" width="8" height="3.2" rx="1.6" transform="rotate(${r} ${x} ${y})" style="fill:${col[i%5]}"/>`).join(''); }
  if(a==='panda'){ under += `<circle cx="28" cy="38" r="14" style="fill:${ink}"/><circle cx="92" cy="38" r="14" style="fill:${ink}"/>`;
    acc += `<ellipse cx="46" cy="${fy}" rx="9" ry="11" transform="rotate(20 46 ${fy})" style="fill:${ink}"/><ellipse cx="74" cy="${fy}" rx="9" ry="11" transform="rotate(-20 74 ${fy})" style="fill:${ink}"/>`;
    eye = '#FFFFFF'; er = 3.4; }
  if(d.r===2) acc += sparkle(14,30,9,'#FFD84A')+sparkle(106,22,7,'#FFD84A')+sparkle(108,96,6,'#FFFFFF')+sparkle(10,96,5,'#FFD84A');
  const face = `<circle cx="47" cy="${fy}" r="${er}" style="fill:${eye}"/><circle cx="73" cy="${fy}" r="${er}" style="fill:${eye}"/>
    <circle cx="48.6" cy="${fy-1.6}" r="1.5" style="fill:${eye===ink?'#fff':ink}"/><circle cx="74.6" cy="${fy-1.6}" r="1.5" style="fill:${eye===ink?'#fff':ink}"/>

  return `<svg viewBox="0 -12 120 128" aria-hidden="true"><g style="fill:${c};stroke:${out}" stroke-width="5" stroke-linejoin="round">${shape}</g><g style="fill:${c}">${shape}</g>${under}

// Velger det som er øvd minst på; ord hun har bommet på kommer oftere igjen
function choose(list, keyf){
  const fresh=list.filter(x=>!G.used.has(keyf(x))), src=fresh.length?fresh:list;
  const missed=src.filter(x=>(S.miss[keyf(x)]||0)>0);
  let it;
  if(missed.length && Math.random()<.4) it=pick(missed);
  else { const min=Math.min(...src.map(x=>S.seen[keyf(x)]||0)); it=pick(src.filter(x=>(S.seen[keyf(x)]||0)<=min)); }
  const k=keyf(it); G.used.add(k); S.seen[k]=(S.seen[k]||0)+1; save(); return it;
}
const ALL_WORDS = TKEYS.flatMap(k=>T[k].items.map(it=>[k,it]));
function newTask(){
  if(G.mode==='finn' || G.mode==='si'){
    const [k,it] = S.topic==='all' ? choose(ALL_WORDS, x=>x[0]+':'+x[1][0]) : [S.topic, choose(T[S.topic].items, x=>S.topic+':'+x[0])];
    const key = k+':'+it[0], pool=T[k].items;
    if(G.mode==='si') return {k, it, key, tries:0, heard:'', hint:false};
    return {k, it, key, opts:shuffle([it,...shuffle(pool.filter(x=>x!==it)).slice(0,3)])};
  }
  if(G.mode==='laerer'){
    const it = choose(CLASS, x=>'class:'+x[0]);
    return {it, key:'class:'+it[0], opts:shuffle([it,...shuffle(CLASS.filter(x=>x!==it)).slice(0,3)])};
  }
  // lytt: 3 historier x 2 spørsmål
  const si = G.i>>1, qi = G.i&1;
  if(qi===0) G.stories[si] = choose(STORIES, x=>'story:'+x.en.slice(0,30));
  const st = G.stories[si], q = st.qs[qi];
  return {st, qi, key:'story:'+st.en.slice(0,30)+':'+qi, fresh: qi===0, order:shuffle(q[2].map((_,i)=>i)), showQn:false, showText:false, showNo:false};
}
function markMiss(){ const t=G.task; if(!t||t.err) return; t.err=true; S.miss[t.key]=(S.miss[t.key]||0)+2; save(); }
function markHit(){ const t=G.task; if(t && !t.err && S.miss[t.key]){ S.miss[t.key]--; if(S.miss[t.key]<=0) delete S.miss[t.key]; save(); } }
function practised(){ return ALL_WORDS.filter(x=>S.seen[x[0]+':'+x[1][0]]).length; }
function speakTask(slow){
  const t=G.task; if(!t) return;
  if(G.mode==='finn') say(word(t.it), false, slow);
  else if(G.mode==='laerer') say(t.it[0], false, slow);
  else if(G.mode==='si') say(T[t.k].q, false, slow);
  else { const q=t.st.qs[t.qi][0]; if(t.fresh){ say(t.st.en,false,slow); say(q,true,slow); t.fresh=false; } else say(q,false,slow); }
}
function startGame(m){
  stopListen();
  G = {mode:m, i:0, earned:0, mistakes:0, used:new Set(), busy:false, stories:[]};
  G.task = newTask(); view='game'; render(); setTimeout(()=>speakTask(),300);
}

function frameTip(k){
  if(/^Say it/.test(T[k].q)) return 'Tips: Si ordet tydelig, gjerne to ganger.';
  const f = {actions:"I'm …", feelings:"I'm …", family:"It's my …", colours:"It's …", numbers:"It's …", weather:"It's …"}[k] || "It's a …";
  return `Tips: Si hele setningen, for eksempel «${f}». Da hører mikrofonen deg bedre.`;
}
function setFb(html){ const f=document.getElementById('fb'); if(f) f.innerHTML=html; }
function nextTask(){ G.i++; if(G.i>=ROUND) return finishRound(); G.task=newTask(); G.busy=false; renderGame(); setTimeout(()=>speakTask(),250); }
function correct(el){
  G.busy = true; sfx.ok();
  const t = G.task, star = !t.err; let wait = 1700;
  if(star){ addStars(1, el); G.earned++; } markHit();
  if(G.mode==='finn' || G.mode==='si'){ say(word(t.it)); setFb(`${esc(word(t.it))} <span class="no">= ${esc(t.it[2])}</span>`); }
  else if(G.mode==='laerer'){ say(t.it[0]); setFb(`${esc(t.it[0])} <span class="no">= ${esc(t.it[2])}</span>`); wait = 2300; }
  else { const q=t.st.qs[t.qi]; say(q[2][q[3]][1]); setFb(`${esc(q[2][q[3]][1])}`); }
  if(star) say(pick(PRAISE), true);
  else { say('Yes!', true); const f=document.getElementById('fb'); if(f) f.insertAdjacentHTML('beforeend','<br><span class="no">Riktig! Stjerne får du når du klarer det på første forsøk.</span>'); wait += 600; }
  setTimeout(nextTask, wait);
}
function wrong(el){ G.mistakes++; markMiss(); sfx.no(); el.classList.add('no'); el.disabled=true; }

// si det: lytt med mikrofon
function doListen(){
  if(listening){ stopListen(); renderGame(); return; }
  const t=G.task; listening=true; renderGame();
  const st=document.getElementById('status'); if(st) st.innerHTML='<b>Jeg lytter …</b> Si svaret nå.';
  listen(alts=>{
    if(G.task!==t || view!=='game') return;
    alts = [...alts].reverse();
    const said = esc(alts[0]||'');
    if(heardIt(alts, t.it, T[t.k].items)){ t.heard = `Jeg hørte: <b>«${said}»</b>`; renderGame(); correct(document.getElementById('micbtn')); }
    else { t.tries++; sfx.no();
      if(t.tries>=5){ markMiss(); t.hint=true; say(word(t.it));
        t.heard = `Jeg hørte: <b>«${said}»</b>. Fem forsøk – ingen stjerne denne gangen. Hør ordet, si det gjerne igjen, eller trykk «Neste».`; }
      else { t.heard = `Jeg hørte: <b>«${said}»</b>. Prøv igjen! <span class="no">(${t.tries} av 5 forsøk)</span>`;
        if(t.tries===3 && !t.hint){ t.hint=true; say(word(t.it)); } }
      renderGame(); }
  }, err=>{
    if(G.task!==t || view!=='game') return;
    if(BLOCK_ERR.includes(err)){ micBlocked=true; toast('Mikrofonen er ikke tillatt her. Bruk «Jeg sa det!»'); }
    else t.heard = 'Jeg hørte ingenting. Trykk og prøv igjen, og si gjerne hele setningen.';
    renderGame();
  }, partial=>heardIt(partial, t.it, T[t.k].items));
}

function finishRound(){
  stopListen();
  const missed = ROUND - G.earned;
  G.bonus = missed===0 ? 3 : missed===1 ? 1 : 0;
  if(G.bonus) addStars(G.bonus);
  view='done'; render(); confetti(missed===0?90:missed<=2?50:0);
  say(missed===0?'Perfect round!':missed<=2?'Well done!':'Good try! Let\'s practise more.');
}
function renderDone(){
  const missed = ROUND - G.earned;
  const msg = missed===0 ? 'Perfekt runde!' : missed===1 ? 'Kjempebra!' : missed<=3 ? 'Bra jobba!' : 'Godt forsøk!';
  const tip = missed===0 ? 'Alle riktige på første forsøk. Du fikk 3 ekstra stjerner!' : missed===1 ? 'Bare én bom! Du fikk 1 ekstra stjerne. Klarer du alle neste gang, får du 3 ekstra.' : 'Prøv å svare riktig på første forsøk. Da får du stjerne for hver oppgave, og 3 ekstra hvis du klarer alle.';
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><span style="flex:1"></span>${starPill()}</div>
  <div class="stage center">
    <h2 style="font-size:36px">${msg}</h2>
    <p class="eng">${missed===0?'Perfect round!':missed<=2?'Well done!':'Good try!'}</p>
    <div class="bigstars">${Array.from({length:ROUND},(_,i)=>i<G.earned?ICON.star:ICON.starOff).join('')}</div>
    <p>Du fikk ${G.earned} av ${ROUND} ${G.earned===1?'stjerne':'stjerner'}${G.bonus?` + ${G.bonus} ekstra`:''}.</p>
    <p style="color:var(--muted);font-size:15px">${tip}</p>
    <p style="color:var(--muted)">${GIFT-S.toNext} ${GIFT-S.toNext===1?'stjerne':'stjerner'} til neste pakke</p>
  </div>
  ${S.gifts>0?`<button class="gift-cta" data-act="gift">${ICON.gift}<span>Åpne pakken!</span></button>`:''}
  <div class="foot" style="justify-content:center"><button class="btn primary" data-act="play" data-m="${G.mode}">Spill igjen</button><button class="btn" data-act="home">Velg ny lek</button></div>`;
}

// ---------- pakker og samling ----------
function renderGift(){
  giftTaps = 0;
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><span style="flex:1"></span>${starPill()}</div>
  <div class="stage center" style="padding-block:32px">
    <h2 style="font-size:28px">Hva er det i pakken?</h2>
    <button class="gift" id="giftbox" data-act="tapgift" aria-label="Trykk på pakken">${GIFT_SVG}</button>
    <div class="taps" id="taps"><i></i><i></i><i></i></div>
    <p class="ask" style="font-size:19px">Trykk på pakken tre ganger!</p>
    <p class="eng" style="font-size:18px">One, two, three!</p>
  </div>`;
}
function openGift(){
  const locked = SQ.map((d,i)=>i).filter(i=>!S.have.includes(i));
  let id;
  if(locked.length){
    const want = Math.random()<.07?2:Math.random()<.27?1:0;
    const byR = r => locked.filter(i=>SQ[i].r===r);
    id = pick(byR(want).length?byR(want):byR(0).length?byR(0):locked);
    S.have.push(id);
  } else id = pick(SQ.map((d,i)=>i));
  S.gifts = Math.max(0,S.gifts-1); save(); lastSq = {id, dup:!locked.length};
  view='reveal'; render(); sfx.open(); confetti(80);
  const d=SQ[id]; setTimeout(()=>{ say('You got '+d.n+'!'); say('It is '+d.cw[0]+'.', true); },400);
}
function renderReveal(){
  const d = SQ[lastSq.id];
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><span style="flex:1"></span>${starPill()}</div>
  <div class="stage center">
    <div class="reveal"><div class="rays"></div><button class="sq-big" data-act="squish" data-id="${lastSq.id}" aria-label="Klem ${esc(d.n)}">${sqSVG(d)}</button></div>
    <h2 style="font-size:30px">${esc(d.n)}</h2>
    <span class="rar r${d.r}">${RAR[d.r]}</span>
    <p><span class="eng" style="font-size:20px">It is ${esc(d.cw[0])}.</span> <span style="color:var(--muted)">(Den er ${esc(d.cw[1])}.)</span></p>
    <p>${lastSq.dup?'Du har allerede hele samlingen. For en samler!':'Trykk på den for å klemme!'}</p>
  </div>
  <div class="foot" style="justify-content:center">
    ${S.gifts>0?`<button class="btn primary" data-act="gift">Åpne neste pakke (${S.gifts})</button>`:''}
    <button class="btn" data-act="coll">Se samlingen</button><button class="btn" data-act="home">Spill mer</button></div>`;
}
function renderColl(){
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><h1 style="font-size:24px;flex:1">Samlingen min</h1>${starPill()}</div>
  <p style="color:var(--muted)">${S.have.length} av ${SQ.length} squishies. Trykk på en for å høre navnet og fargen på engelsk.</p>
  <div class="coll">${SQ.map((d,i)=>{ const own=S.have.includes(i);
    return own ? `<button class="card" data-act="squish" data-id="${i}"><div class="art">${sqSVG(d)}</div><span>${esc(d.n)}</span></button>`
               : `<div class="card locked"><div class="art">${sqSVG(d,true)}</div><span>???</span></div>`; }).join('')}</div>
  ${S.gifts>0?`<button class="gift-cta" data-act="gift">${ICON.gift}<span>Åpne pakke (${S.gifts})</span></button>`:''}`;
}

function render(){
  if(view==='home') renderHome(); else if(view==='game') renderGame(); else if(view==='done') renderDone();
  else if(view==='gift') renderGift(); else if(view==='reveal') renderReveal(); else renderColl();
  window.scrollTo(0,0);
}

// ---------- hendelser ----------
app.addEventListener('change', e=>{
  if(e.target.id==='voicesel'){ S.voice=e.target.value; save(); pickVoice(); ttsOK=null; say('Hello! How are you?'); setTimeout(updateVoiceNote,2700); }
});
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='home'){ stopListen(); try{speechSynthesis.cancel()}catch(x){} confirmReset=false; view='home'; render(); }
  else if(act==='play'){ sfx.tap(); startGame(b.dataset.m); }
  else if(act==='topic'){ S.topic=b.dataset.t; save(); sfx.tap(); renderHome(); }
  else if(act==='rate'){ S.rate=+b.dataset.r; save(); renderHome(); say('Hello! How are you?'); }
  else if(act==='sound'){ S.sound=!S.sound; save(); renderHome(); sfx.tap(); }
  else if(act==='reset'){ confirmReset=true; renderHome(); }
  else if(act==='reset-no'){ confirmReset=false; renderHome(); }
  else if(act==='reset-yes'){ Object.assign(S,{stars:0,toNext:0,gifts:1,have:[]}); save(); confirmReset=false; renderHome(); toast('Alt er nullstilt'); }
  else if(act==='coll'){ view='coll'; render(); }
  else if(act==='gift'){ view='gift'; render(); }
  else if(act==='replay'){ speakTask(); }
  else if(act==='slow'){ speakTask(true); }
  else if(act==='adult'){ const r=document.getElementById('adultans'); if(r) r.hidden=!r.hidden; }
  else if(act==='testvoice'){ ttsOK=null; say('Hello! How are you?'); setTimeout(updateVoiceNote,2700); const n=document.getElementById('voicenote'); if(n) n.textContent='Tester …'; }
  else if(act==='testmic'){
    micBlocked = !SRC; micErr='';
    const n=document.getElementById('micnote'); if(n) n.innerHTML='<b>Jeg lytter …</b> Si «hello».';
    listen(alts=>{ const m=document.getElementById('micnote'); if(m) m.innerHTML=`Mikrofonen virker! Jeg hørte: <b>«${esc(alts[0]||'')}»</b>`; },
      err=>{ if(BLOCK_ERR.includes(err)) micBlocked=true; const m=document.getElementById('micnote'); if(m) m.textContent = BLOCK_ERR.includes(err) ? micStatus() : 'Jeg hørte ingenting. Prøv igjen.'; if(micBlocked) renderHome(); });
  }
  else if(act==='tapgift'){
    giftTaps++; const box=document.getElementById('giftbox'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    tone(300+giftTaps*150,.12,'triangle'); document.querySelectorAll('#taps i').forEach((d,i)=>d.classList.toggle('on',i<giftTaps));
    say(['one','two','three'][giftTaps-1]||'');
    if(giftTaps>=3) setTimeout(openGift,450);
  }
  else if(act==='squish'){ const d=SQ[+b.dataset.id]; bump(b.querySelector('svg')||b); sfx.squish(); say(d.n+'. It is '+d.cw[0]+'.'); }
  else if(view==='game' && G){
    const t = G.task;
    if(act==='story'){ say(t.st.en); }
    else if(act==='slowstory'){ say(t.st.en,false,true); }
    else if(act==='qn'){ t.showQn=!t.showQn; renderGame(); }
    else if(act==='text'){ t.showText=!t.showText; if(!t.showText) t.showNo=false; renderGame(); }
    else if(act==='textno'){ t.showNo=!t.showNo; renderGame(); }
    else if(G.busy) return;
    else if(act==='mic'){ doListen(); }
    else if(act==='hint'){ markMiss(); t.hint=true; renderGame(); say(word(t.it)); }
    else if(act==='selfok'){ correct(b); }
    else if(act==='skip'){ G.mistakes++; markMiss(); G.busy=true; stopListen(); nextTask(); }
    else if(act==='pick'){
      const ok = G.mode==='lytt' ? +b.dataset.v===t.st.qs[t.qi][3] : b.dataset.v===t.it[0];
      if(ok){ b.classList.add('ok'); document.querySelectorAll('[data-act=pick]').forEach(x=>x.disabled=true); correct(b); }
      else { wrong(b); setTimeout(()=>speakTask(),350); }
    }
  }
});

render();
</script>

</body></html>
