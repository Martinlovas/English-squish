<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#FF5C8A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Matteponni">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Matteponni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@700;800&display=swap">
<style>
/* Layout: samme lekesøyle som Lesesquish og English Squish; beite-grønn bakgrunn; tykke trykk-brikker */
:root{
  --bg:#E9F4E6; --paper:#FFFFFF; --fg:#24301F; --muted:#61705A;
  --accent:#FF5C8A; --star:#F5A800; --good:#1F9D63; --bad:#E5484D;
  --line:#CFE0C8; --locked:#DCE8D6; --tile:#FFFFFF; --tile-edge:#BFD4B6; --soft:#DDEED7; --math:#2F7DD8;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Verdana","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#142018; --paper:#1F2E23; --fg:#EEF6EA; --muted:#A3B89C;
  --accent:#FF7AA2; --star:#FFC83D; --good:#3DD68C; --bad:#FF6B6F;
  --line:#35503C; --locked:#2C4232; --tile:#28392C; --tile-edge:#0B140D; --soft:#263A2B; --math:#7FB2FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#142018; --paper:#1F2E23; --fg:#EEF6EA; --muted:#A3B89C;
  --accent:#FF7AA2; --star:#FFC83D; --good:#3DD68C; --bad:#FF6B6F;
  --line:#35503C; --locked:#2C4232; --tile:#28392C; --tile-edge:#0B140D; --soft:#263A2B; --math:#7FB2FF; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--read);font-size:17px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

.bar{display:flex;align-items:center;gap:10px}
.bar h1{font-size:30px;flex:1;letter-spacing:.5px}
.bar h1 span{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--tile-edge)}
.pill svg{width:22px;height:22px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--tile-edge)}
.icon-btn svg{width:24px;height:24px}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--good)}
.dots i.now{background:var(--accent);transform:scale(1.25)}

.progress{background:var(--paper);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress h2{font-size:20px}
.progress small{color:var(--muted);font-size:15px}
.meter{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter b{display:block;height:100%;background:var(--star);border-radius:99px;transition:width .5s}
.gift-cta{display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:18px;padding:12px 16px;font-family:var(--display);font-size:20px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);animation:wiggle 1.6s infinite}
.gift-cta svg{width:44px;height:44px;flex:none}

.label{font-family:var(--display);font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--tile);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--tile-edge);transition:transform .08s}
.mode:active,.tile:active,.btn:active,.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tile-edge)}
.mode .glyph{font-family:var(--display);font-size:30px;line-height:1;height:40px;display:flex;align-items:center;gap:6px}
.mode .glyph small{font-size:22px}
.mode h3{font-size:18px}
.mode p{font-size:14px;color:var(--muted)}
.m1 .glyph{color:#2F7DD8}.m2 .glyph{color:#14A88A}.m3 .glyph{color:var(--accent)}.m4 .glyph{color:#C27C00}
:root[data-theme="dark"] .m4 .glyph{color:var(--star)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .m4 .glyph{color:var(--star)}}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--paper);font-weight:700;box-shadow:0 3px 0 var(--tile-edge);font-size:15px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.chip.n{min-width:44px;font-variant-numeric:tabular-nums}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:12px 18px;border-radius:16px;background:var(--paper);font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--tile-edge);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:24px;height:24px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.small{font-family:var(--read);font-weight:700;font-size:15px;padding:9px 14px}
.btn.wide{width:100%}
.btn.soft{background:var(--soft);box-shadow:none}

.stage{background:var(--paper);border-radius:26px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ask{font-family:var(--display);font-size:22px;text-wrap:balance}
.askrow{display:flex;align-items:center;gap:10px;justify-content:center}
.speak{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);flex:none}
.speak svg{width:26px;height:26px}
.expr{font-family:var(--display);font-size:clamp(40px,12vw,58px);line-height:1.1;font-variant-numeric:tabular-nums;color:var(--fg);display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.expr .op{color:var(--math)}
.box{display:inline-grid;place-items:center;min-width:1.6em;height:1.25em;padding:0 .15em;border-radius:14px;border:4px dashed var(--accent);color:var(--accent)}
.box.filled{border-style:solid}
.big{font-family:var(--display);font-size:clamp(44px,13vw,64px);line-height:1;color:var(--math);font-variant-numeric:tabular-nums}
.vis{display:grid;place-items:center;max-width:100%}
.vis svg{max-width:100%;height:auto;overflow:visible}
.fb{min-height:26px;font-weight:700;font-size:19px;color:var(--good);text-wrap:balance}
.fb .no{color:var(--muted);font-weight:400}
.tip{font-size:16px;color:var(--muted);background:var(--soft);border-radius:14px;padding:8px 12px}
.opts{display:grid;gap:12px}
.opts.four{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--tile);border-radius:20px;box-shadow:0 5px 0 var(--tile-edge);font-family:var(--display);font-size:40px;min-height:88px;display:grid;place-items:center;transition:transform .08s,background .2s;min-width:0;padding:8px 6px;font-variant-numeric:tabular-nums}
.tile.word{font-family:var(--read);font-weight:700;font-size:21px;line-height:1.2;text-wrap:balance}
.tile.ok{background:var(--good);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--good) 55%,#000);animation:pop .4s}
.tile.no{opacity:.35;animation:shake .4s}
.tile:disabled{cursor:default}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--display)}
.frac b{font-weight:800;padding:0 .15em}
.frac i{font-style:normal;border-top:4px solid currentColor;padding:2px .15em 0}
.story{width:100%;box-sizing:border-box;text-align:left;background:var(--soft);border-radius:16px;padding:14px 16px;font-size:20px;line-height:1.5}
.story b{color:var(--math)}

/* tallknapper */
.answer{font-family:var(--display);font-size:46px;min-width:150px;min-height:64px;padding:4px 18px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-variant-numeric:tabular-nums;box-sizing:border-box}
.answer.empty{color:var(--muted)}
.answer.no{animation:shake .4s;background:color-mix(in srgb,var(--bad) 22%,var(--soft))}
.answer.ok{background:var(--good);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{background:var(--tile);border-radius:18px;box-shadow:0 5px 0 var(--tile-edge);font-family:var(--display);font-size:32px;min-height:64px;display:grid;place-items:center}
.key.ok{background:var(--accent);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);font-size:24px}
.key.del{font-size:26px;color:var(--muted)}
.key:disabled{opacity:.5}

/* penger */
.money{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;max-width:100%}
.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#3B3A36;position:relative;box-shadow:inset 0 0 0 4px rgba(0,0,0,.12)}
.coin.s{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CDD3 70%)}
.coin.g{background:radial-gradient(circle at 35% 30%,#FFF4C2,#E0B44A 70%)}
.coin.hole span{position:absolute;top:6px;font-size:13px}
.coin.hole::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.coin.c20{width:64px;height:64px}
.note{width:96px;height:52px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.note.n50{background:#3E9B6A}.note.n100{background:#C9483F}.note.n200{background:#3F6CC9}

.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.bigstars{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bigstars svg{width:40px;height:40px}
.gift{width:200px;height:200px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.gift svg{width:100%;height:100%}
.gift.shake{animation:giftshake .45s}
.taps{display:flex;gap:10px}.taps i{width:16px;height:16px;border-radius:50%;background:var(--line)}.taps i.on{background:var(--accent)}
.reveal{position:relative;display:grid;place-items:center;width:240px;height:240px;max-width:100%}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--star) 45%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.hz-big{position:relative;width:210px;height:210px;animation:appear .6s cubic-bezier(.3,1.6,.5,1)}
.hz-big svg,.card svg{width:100%;height:100%;overflow:visible}
.rar{font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;background:var(--soft)}
.rar.r1{background:#D9E8FF;color:#1E4FB3}.rar.r2{background:#FFF0B3;color:#7A5500}
.facts{color:var(--muted)}
.facts b{color:var(--fg)}
.trot{animation:trot .55s}

.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.card{background:var(--paper);border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .art{width:80px;height:80px}
.card span{font-size:13px;font-weight:700;line-height:1.2;text-align:center}
.card small{font-size:12px;color:var(--muted);line-height:1.1}
.card.locked span{color:var(--muted)}

.voicebox select{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%;max-width:100%}
.voicenote{color:var(--muted);font-size:14px}
.voicenote b{color:var(--fg)}
.practised{font-size:15px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:16px;font-family:var(--display);font-size:18px;z-index:20;animation:up .3s;max-width:calc(100% - 48px);text-align:center}
.plus{position:fixed;font-family:var(--display);font-size:26px;color:var(--star);pointer-events:none;z-index:30;animation:float 1s forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:25;pointer-events:none;animation:fall linear forwards}

.cnt{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(24px,7.5vw,32px);line-height:1.2;letter-spacing:2px}
.code{width:100%;box-sizing:border-box;text-align:left;background:var(--soft);border-radius:14px;padding:12px 14px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.opts.two{grid-template-columns:1fr 1fr}
.mixed{display:inline-flex;align-items:center;gap:.18em}
.pad.ext{grid-template-columns:repeat(4,1fr)}
.key.span3{grid-column:span 3}
.key.sym{color:var(--math)}
.grades{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grades .chip{padding:9px 0;text-align:center;font-family:var(--display);font-size:17px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes giftshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) scale(1.05)}50%{transform:rotate(9deg) scale(1.08)}80%{transform:rotate(-5deg)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@keyframes trot{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-6deg)}50%{transform:translateY(0) rotate(0)}70%{transform:translateY(-7px) rotate(4deg)}100%{transform:translateY(0)}}
@keyframes appear{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
@keyframes float{to{transform:translateY(-60px);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
// ---------- innhold: matematikk 1.–7. trinn (LK20). Oppsett per trinn: se GR lenger ned. ----------

// Premiene: egne hester og ponnier (norske og kjente raser + noen eventyrponnier)
// f = kjennetegn: blaze (bles), star (stjerne), socks (sokker), spots (prikker), dapple (skimmel), pinto (flekker),
//     fjord (fjording-man), horn, wings, bow, flowers, rainbow, aurora, gold
const HZ = [
  {n:'Fjordis',  b:'Fjording',            c:'#E5C994', m:'#F6EEDC', f:['fjord'],          h:140, r:0, hun:1},
  {n:'Dølla',    b:'Dølahest',            c:'#4B2E22', m:'#1C1310', f:['blaze'],          h:152, r:0, hun:1},
  {n:'Lyngsi',   b:'Nordlandshest',       c:'#8C5A38', m:'#3A2418', f:['star'],           h:132, r:0},
  {n:'Sjokki',   b:'Shetlandsponni',      c:'#5E3B28', m:'#2A1A12', f:[],                 h:100, r:0},
  {n:'Isla',     b:'Islandshest',         c:'#C69E78', m:'#F1E3CB', f:[],                 h:136, r:0, hun:1},
  {n:'Honning',  b:'Haflinger',           c:'#C97F3C', m:'#F7E3A6', f:['blaze'],          h:145, r:0, hun:1},
  {n:'Natta',    b:'Frieser',             c:'#26242C', m:'#100F15', f:[],                 h:162, r:0, hun:1},
  {n:'Prikka',   b:'Appaloosa',           c:'#F1ECE3', m:'#6B5A4E', f:['spots'],          h:150, r:0, hun:1},
  {n:'Grålle',   b:'Gråskimmel',          c:'#C9CCD2', m:'#868B94', f:['dapple'],         h:155, r:0},
  {n:'Flekka',   b:'Pinto',               c:'#A3653E', m:'#F4F0EA', f:['pinto'],          h:148, r:0, hun:1},
  {n:'Safira',   b:'Araber',              c:'#ECE7E1', m:'#CFC8BF', f:['bow'],            h:150, r:0, hun:1},
  {n:'Kanel',    b:'New Forest-ponni',    c:'#A2562E', m:'#5A2A16', f:['socks'],          h:140, r:0},
  {n:'Bjølle',   b:'Connemaraponni',      c:'#B98B5E', m:'#7A4F2E', f:['star'],           h:145, r:0},
  {n:'Mokka',    b:'Welshponni',          c:'#7B4B2F', m:'#3A2215', f:['socks','blaze'],  h:125, r:0},
  {n:'Kløver',   b:'Kaldblodstraver',     c:'#9B5B32', m:'#EAD8A6', f:['flowers'],        h:155, r:0},
  {n:'Tussi',    b:'Minihest',            c:'#E2B49A', m:'#8A5B44', f:['bow'],            h:85,  r:0, hun:1},
  {n:'Månestråle',b:'Enhjørning',         c:'#F3EEFF', m:'#B4A0FF', f:['horn'],           h:150, r:1, hun:1},
  {n:'Skysurfer',b:'Bevinget hest',       c:'#E4F1FF', m:'#7FB2FF', f:['wings'],          h:155, r:1},
  {n:'Rosa Rakett',b:'Rosa ponni',        c:'#FFC6DC', m:'#FF6FA6', f:['flowers'],        h:120, r:1, hun:1},
  {n:'Lakris',   b:'Trolleponni',         c:'#3A3340', m:'#FF5C8A', f:['bow','star'],     h:110, r:1, hun:1},
  {n:'Havbris',  b:'Havponni',            c:'#9FE3D8', m:'#3D8BFF', f:['socks'],          h:130, r:1},
  {n:'Regnbue-Rita',b:'Regnbueponni',     c:'#FFFFFF', m:'#FF5C8A', f:['rainbow','horn'], h:140, r:2, hun:1},
  {n:'Gullhoven',b:'Gullhest',            c:'#FFD24A', m:'#FFF3B0', f:['gold','wings'],   h:160, r:2},
  {n:'Nordlys',  b:'Nordlysponni',        c:'#22305A', m:'#3DE0B0', f:['aurora','star'],  h:150, r:2, hun:1}
];
const RAR = ['Vanlig','Sjelden','Glitter'];
const GIFT = 15, ROUND = 6;
const PRAISE = ['Kjempebra!','Riktig!','Supert!','Flott regnet!','Helt riktig!','Knallbra!','Du er god!'];

// ---------- state ----------
const KEY = 'matteponni.v1';
const S = {stars:0,toNext:0,gifts:1,have:[],topic:'all',tables:[2,3,4,5,10],sound:true,voice:'',rate:.95,done:0,redo:[],grade:3,doneG:{}};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
if(!Array.isArray(S.redo)) S.redo=[]; if(!Array.isArray(S.tables)||!S.tables.length) S.tables=[2,3,4,5,10];
if(!(S.grade>=1&&S.grade<=7)) S.grade=3; if(!S.doneG||typeof S.doneG!=='object') S.doneG={};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let G = null, view = 'home', confirmReset = false, giftTaps = 0, lastHz = null;
const app = document.getElementById('app');

// ---------- hjelpere ----------
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.random()*a.length|0];
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => String(n);
function frac(s){ const [a,b]=String(s).split('/'); return `<span class="frac"><b>${a}</b><i>${b}</i></span>`; }

function mc(ans, cands, n=4, show){
  const key=v=>typeof v==='number'?String(Math.round(v*1e6)/1e6):String(v), seen=new Set([key(ans)]), out=[ans];
  const okNeg=typeof ans==='number'&&ans<0;
  for(const c of shuffle(cands)){ if(out.length>=n) break; if(c==null) continue; if(typeof c==='number'&&(!isFinite(c)||(c<0&&!okNeg))) continue;
    const k=key(c); if(seen.has(k)) continue; seen.add(k); out.push(typeof c==='number'?Math.round(c*1e6)/1e6:c); }
  if(typeof ans==='number'){ const st=Number.isInteger(ans)?(Math.abs(ans)>=50?10:1):(Number.isInteger(Math.round(ans*1e6)/1e5)?0.1:0.01); let k=1;
    while(out.length<n && k<60){ const c=Math.round((ans+Math.ceil(k/2)*st*(k%2?1:-1))*1e6)/1e6; k++; if(c<0&&!okNeg) continue; const kk=key(c); if(!seen.has(kk)){ seen.add(kk); out.push(c); } } }
  return shuffle(out).map(v=>({v:key(v), h: show? show(v) : esc(typeof v==='number'?nf(v):v)}));
}

let AC = null;
function tone(f,d,type='sine',when=0,vol=.18,f2){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime+when, o = AC.createOscillator(), g = AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}

  neigh(){ tone(900,.5,'triangle',0,.12,500); tone(700,.35,'triangle',.25,.1,380); },
  clop(){ [0,.13,.32,.45].forEach(w=>tone(w%0.3<.1?520:440,.06,'square',w,.06)); },

const HAS_TTS = typeof window.speechSynthesis!=='undefined' && typeof window.SpeechSynthesisUtterance!=='undefined';
let VOICE = null, keep = [];
function rankVoice(v){
  let s; const n=v.name+' '+v.voiceURI;
  if(/^nb/i.test(v.lang)) s=100; else if(/^no/i.test(v.lang)) s=95; else if(/^nn/i.test(v.lang)) s=80; else return -1;
  if(/natural|neural/i.test(n)) s+=60; if(/premium|enhanced|forbedret/i.test(n)) s+=45; if(/online|google/i.test(n)) s+=25; if(/compact|espeak/i.test(n)) s-=40;
  return s;
}
function voiceList(){ try{ return speechSynthesis.getVoices().map(v=>[rankVoice(v),v]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]); }catch(e){ return []; } }
function pickVoice(){ const L=voiceList(); VOICE = L.find(v=>v.voiceURI===S.voice) || L[0] || null; fillVoiceSelect(); }
function fillVoiceSelect(){
  const sel=document.getElementById('voicesel'); if(!sel) return;
  const L=voiceList();
  sel.innerHTML = L.length ? L.map(v=>`<option value="${esc(v.voiceURI)}"${VOICE&&v.voiceURI===VOICE.voiceURI?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')
                           : '<option>Ingen norsk stemme funnet</option>';
  sel.disabled=!L.length;
}
if(HAS_TTS){ try{ pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function say(t, queue){
  if(!S.sound || !HAS_TTS || !t) return;
  try{
    if(!queue && (speechSynthesis.speaking||speechSynthesis.pending)) speechSynthesis.cancel();
    speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(t.replace(/·/g,' ganger ').replace(/−/g,' minus ').replace(/:/g,' delt på ').replace(/\+/g,' pluss ').replace(/²/g,' i andre').replace(/³/g,' i tredje').replace(/⁴/g,' i fjerde').replace(/⁵/g,' i femte').replace(/⁶/g,' i sjette').replace(/%/g,' prosent'));
    u.lang = VOICE ? VOICE.lang : 'nb-NO'; if(VOICE) u.voice=VOICE; u.rate=S.rate||.95;
    keep.push(u); if(keep.length>8) keep.shift(); speechSynthesis.speak(u);
  }catch(e){}
}

function clockSVG(h,m){
  const ha=((h%12)+m/60)*30, ma=m*6;
  let ticks='', nums='';
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, r1=i%5?50:46, r2=53;
    ticks+=`<line x1="${60+r1*Math.sin(a)}" y1="${60-r1*Math.cos(a)}" x2="${60+r2*Math.sin(a)}" y2="${60-r2*Math.cos(a)}" style="stroke:var(--muted)" stroke-width="${i%5?1:2.5}"/>`; }
  for(let i=1;i<=12;i++){ const a=i*30*Math.PI/180; nums+=`<text x="${60+38*Math.sin(a)}" y="${60-38*Math.cos(a)+5}" text-anchor="middle" style="fill:var(--fg);font:700 14px var(--display)">${i}</text>`; }
  const hand=(ang,len,w,col)=>{ const a=ang*Math.PI/180; return `<line x1="60" y1="60" x2="${60+len*Math.sin(a)}" y2="${60-len*Math.cos(a)}" style="stroke:${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
  return `<svg viewBox="0 0 120 120" width="200" height="200" role="img" aria-label="Klokke"><circle cx="60" cy="60" r="56" style="fill:var(--tile);stroke:var(--fg)" stroke-width="4"/>${ticks}${nums}
    ${hand(ha,26,7,'var(--fg)')}${hand(ma,42,4,'var(--accent)')}<circle cx="60" cy="60" r="4.5" style="fill:var(--fg)"/></svg>`;
}
function pieSVG(n,k){

    p+=`<path d="M60 60L${60+50*Math.cos(a0)} ${60+50*Math.sin(a0)}A50 50 0 0 1 ${60+50*Math.cos(a1)} ${60+50*Math.sin(a1)}Z" style="fill:${i<k?'var(--accent)':'var(--tile)'};stroke:var(--fg)" stroke-width="3" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 120 120" width="170" height="170" role="img" aria-label="Pizza delt i ${n} like deler">${p}</svg>`;
}

function plusAt(el,txt){ const r=el.getBoundingClientRect(), p=document.createElement('div'); p.className='plus'; p.textContent=txt;
  p.style.left=(r.left+r.width/2-18)+'px'; p.style.top=(r.top)+'px'; document.body.appendChild(p); setTimeout(()=>p.remove(),1000); }
function confetti(n=60){ const col=['#FF5C8A','#3D7BFF','#FFC83D','#1FBF8F','#A06BFF'];
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw';
    c.style.background=pick(col); c.style.animationDuration=(1.6+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3800); } }

function addStars(n, fromEl){
  for(let i=0;i<n;i++){ S.stars++; S.toNext++; if(S.toNext>=GIFT){ S.toNext-=GIFT; S.gifts++; setTimeout(()=>{ toast('Ny pakke! Du kan åpne den snart'); sfx.open(); },500); } }

// ---------- spill ----------
function startGame(m){ G={mode:m,i:0,earned:0,used:new Set(),busy:false}; G.task=newTask(); view='game'; render(); autoSay(); }
function autoSay(){ const t=G&&G.task; if(t&&t.autosay) setTimeout(()=>say(t.speak),300); }
function renderGame(){
  const t=G.task;
  const dots=Array.from({length:ROUND},(_,i)=>`<i class="${i<G.i?'done':i===G.i?'now':''}"></i>`).join('');
  let stage = `<div class="stage">
    <div class="askrow"><button class="speak" data-act="replay" aria-label="Les opp">${ICON.speak}</button><p class="ask">${esc(t.ask)}</p></div>
    ${t.story?`<p class="story">${t.story}</p>`:''}
    ${t.expr?exprHTML(t.expr.map(p=>typeof p==='number'?nf(p):String(p))):''}
    ${t.vis?`<div class="vis">${t.vis}</div>`:''}
    ${t.kind==='num'?`<div class="answer${t.typed?'':' empty'}" id="answer" aria-live="polite">${t.typed||'_'}</div>`:''}
    ${t.showTip&&t.tip?`<p class="tip">${esc(t.tip)}</p>`:''}
    <p class="fb" id="fb">${t.fbHTML||''}</p>
    ${t.tip&&!t.showTip?`<button class="btn small soft" data-act="tip">Trenger du et tips?</button>`:''}
  </div>`;
  let input='';
  if(t.kind==='num'){
    const K=n=>`<button class="key" data-act="key" data-k="${n}">${n}</button>`;
    input = (S.grade>=5||t.neg||t.dec)
      ? `<div class="pad ext">${K(7)}${K(8)}${K(9)}<button class="key del" data-act="key" data-k="del" aria-label="Slett">⌫</button>
          ${K(4)}${K(5)}${K(6)}<button class="key sym" data-act="key" data-k="," aria-label="Komma">,</button>
          ${K(1)}${K(2)}${K(3)}<button class="key sym" data-act="key" data-k="−" aria-label="Minus">−</button>
          ${K(0)}<button class="key ok span3" data-act="key" data-k="ok">Svar</button></div>`
      : `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(K).join('')}
      <button class="key del" data-act="key" data-k="del" aria-label="Slett">⌫</button>${K(0)}<button class="key ok" data-act="key" data-k="ok">Svar</button></div>`;
  } else {
    input = `<div class="opts ${t.cols||'four'}">${t.opts.map(o=>`<button class="tile${t.word?' word':''}" data-act="pick" data-v="${esc(o.v)}">${o.h}${t.unit&&!t.word?'<small style="font-size:.45em"> kr</small>':''}</button>`).join('')}</div>`;
  }
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><div class="dots">${dots}</div>${starPill()}</div>${stage}${input}`;
}
function setFb(html){ const f=document.getElementById('fb'); if(f) f.innerHTML=html; if(G&&G.task) G.task.fbHTML=html; }
function nextTask(){ G.i++; if(G.i>=ROUND) return finishRound(); G.task=newTask(); G.busy=false; renderGame(); autoSay(); }
function correct(el){
  G.busy=true; sfx.ok();
  const t=G.task, star=!t.err; markHit();
  if(star){ addStars(1, el); G.earned++; }
  const p=pick(PRAISE);
  const box=document.getElementById('box'); if(box){ box.innerHTML=typeof t.ans==='number'?nf(t.ans):(/\//.test(t.ans)?fracH(t.ans):esc(t.ans)); box.classList.add('filled'); }
  setFb(`${star?p:'Riktig!'} <span class="no">${esc(t.show)}</span>${star?'':'<br><span class="no">Stjerne får du når du klarer det på første forsøk.</span>'}`);
  say(star?p:'Riktig!');
  setTimeout(nextTask, star?1600:2300);
}
function wrongNum(){
  const t=G.task; t.tries++; markMiss(); sfx.no();
  const a=document.getElementById('answer'); if(a){ a.classList.remove('no'); void a.offsetWidth; a.classList.add('no'); }
  t.typed='';
  if(t.tries>=2){ t.fbHTML=`<span class="no">Svaret er <b style="color:var(--fg)">${nf(t.ans)}</b>. Skriv det inn.</span>`; }
  else { t.fbHTML=`<span class="no">Ikke helt. Prøv igjen!</span>`; if(t.tip) t.showTip=true; }
  setTimeout(renderGame,420);
}
function keyPress(k){
  const t=G.task; if(G.busy||!t||t.kind!=='num') return;
  if(k==='del'){ t.typed=t.typed.slice(0,-1); sfx.tap(); }
  else if(k===','){ if(t.typed.includes(',')) return; t.typed=(t.typed===''||t.typed==='−'?t.typed+'0':t.typed)+','; sfx.tap(); }
  else if(k==='−'){ t.typed=t.typed.startsWith('−')?t.typed.slice(1):'−'+t.typed; sfx.tap(); }
  else if(k==='ok'){ const v=Number(t.typed.replace('−','-').replace(',','.')); if(!t.typed||t.typed==='−'||isNaN(v)) return; if(Math.abs(v-t.ans)<1e-9){ const a=document.getElementById('answer'); if(a){ a.classList.add('ok'); } document.querySelectorAll('.key').forEach(x=>x.disabled=true); correct(a); return; } wrongNum(); return; }
  else { if(t.typed.replace(/[−,]/g,'').length>=8) return; t.typed=(t.typed==='0'?'':t.typed==='−0'?'−':t.typed)+k; sfx.tap(); }
  const a=document.getElementById('answer'); if(a){ a.textContent=t.typed||'_'; a.classList.toggle('empty',!t.typed); a.classList.remove('no'); }
}
function finishRound(){
  const missed=ROUND-G.earned; G.bonus=missed===0?3:missed===1?1:0; if(G.bonus) addStars(G.bonus);
  view='done'; render(); confetti(missed===0?90:missed<=2?50:0); sfx.neigh();
  say(missed===0?'Perfekt runde!':missed<=2?'Kjempebra!':'Godt forsøk!');
}
function renderDone(){
  const missed=ROUND-G.earned;
  const msg=missed===0?'Perfekt runde!':missed===1?'Kjempebra!':missed<=3?'Bra jobba!':'Godt forsøk!';
  const tip=missed===0?'Alle riktige på første forsøk. Du fikk 3 ekstra stjerner!':missed===1?'Bare én bom! Du fikk 1 ekstra stjerne. Klarer du alle neste gang, får du 3 ekstra.':'Prøv å svare riktig på første forsøk. Da får du stjerne for hver oppgave, og 3 ekstra hvis du klarer alle.';
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><span style="flex:1"></span>${starPill()}</div>
  <div class="stage center">
    <h2 style="font-size:36px">${msg}</h2>
    <div class="bigstars">${Array.from({length:ROUND},(_,i)=>i<G.earned?ICON.star:ICON.starOff).join('')}</div>
    <p>Du fikk ${G.earned} av ${ROUND} ${G.earned===1?'stjerne':'stjerner'}${G.bonus?` + ${G.bonus} ekstra`:''}.</p>
    <p style="color:var(--muted);font-size:15px">${tip}</p>
    <p style="color:var(--muted)">${GIFT-S.toNext} ${GIFT-S.toNext===1?'stjerne':'stjerner'} til neste pakke</p>
  </div>
  ${S.gifts>0?`<button class="gift-cta" data-act="gift">${ICON.gift}<span>Åpne pakken!</span></button>`:''}
  <div class="foot" style="justify-content:center"><button class="btn primary" data-act="play" data-m="${G.mode}">Spill igjen</button><button class="btn" data-act="home">Velg ny lek</button></div>`;
}

// ---------- pakker og stall ----------
function renderGift(){
  giftTaps=0;
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><span style="flex:1"></span>${starPill()}</div>
  <div class="stage center" style="padding-block:32px">
    <h2 style="font-size:28px">Hvilken hest er i pakken?</h2>
    <button class="gift" id="giftbox" data-act="tapgift" aria-label="Trykk på pakken">${GIFT_SVG}</button>
    <div class="taps" id="taps"><i></i><i></i><i></i></div>
    <p class="ask" style="font-size:19px">Trykk på pakken tre ganger!</p>
  </div>`;
}
function openGift(){
  const locked=HZ.map((d,i)=>i).filter(i=>!S.have.includes(i)); let id;
  if(locked.length){ const want=Math.random()<.07?2:Math.random()<.27?1:0; const byR=r=>locked.filter(i=>HZ[i].r===r);
    id=pick(byR(want).length?byR(want):byR(0).length?byR(0):locked); S.have.push(id); }
  else id=pick(HZ.map((d,i)=>i));
  S.gifts=Math.max(0,S.gifts-1); save(); lastHz={id,dup:!locked.length};
  view='reveal'; render(); sfx.open(); confetti(80);
  const d=HZ[id]; setTimeout(()=>{ sfx.neigh(); say(`Du fikk ${d.n}! ${d.hun?'Hun':'Han'} er en ${d.b.toLowerCase()} og er ${d.h} centimeter høy.`); },500);
}
function renderReveal(){
  const d=HZ[lastHz.id];
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><span style="flex:1"></span>${starPill()}</div>
  <div class="stage center">
    <div class="reveal"><div class="rays"></div><button class="hz-big" data-act="pat" data-id="${lastHz.id}" aria-label="Klapp ${esc(d.n)}">${hzSVG(d)}</button></div>
    <h2 style="font-size:30px">${esc(d.n)}</h2>
    <span class="rar r${d.r}">${RAR[d.r]}</span>
    <p class="facts"><b>${esc(d.b)}</b> · ${d.h} cm høy</p>
    <p class="facts">${d.h} cm er ${heightWords(d.h)}.</p>
    <p>${lastHz.dup?'Du har alle hestene i stallen. For en samler!':'Trykk på hesten for å klappe den!'}</p>
  </div>
  <div class="foot" style="justify-content:center">
    ${S.gifts>0?`<button class="btn primary" data-act="gift">Åpne neste pakke (${S.gifts})</button>`:''}
    <button class="btn" data-act="coll">Se stallen</button><button class="btn" data-act="home">Spill mer</button></div>`;
}
function renderColl(){
  app.innerHTML = `<div class="bar"><button class="icon-btn" data-act="home" aria-label="Hjem">${ICON.home}</button><h1 style="font-size:24px;flex:1">Stallen min</h1>${starPill()}</div>
  <p style="color:var(--muted)">${S.have.length} av ${HZ.length} hester og ponnier. Trykk på en for å høre hvem den er.</p>
  <div class="coll">${HZ.map((d,i)=>{ const own=S.have.includes(i);
    return own ? `<button class="card" data-act="pat" data-id="${i}"><div class="art">${hzSVG(d)}</div><span>${esc(d.n)}</span><small>${esc(d.b)}</small></button>`
               : `<div class="card locked"><div class="art">${hzSVG(d,true)}</div><span>???</span><small>${RAR[d.r]}</small></div>`; }).join('')}</div>
  ${S.gifts>0?`<button class="gift-cta" data-act="gift">${ICON.gift}<span>Åpne pakke (${S.gifts})</span></button>`:''}`;
}

function render(){
  if(view==='home') renderHome(); else if(view==='game') renderGame(); else if(view==='done') renderDone();
  else if(view==='gift') renderGift(); else if(view==='reveal') renderReveal(); else renderColl();
  window.scrollTo(0,0);
}

// ---------- hendelser ----------
app.addEventListener('change', e=>{ if(e.target.id==='voicesel'){ S.voice=e.target.value; save(); pickVoice(); say('Hei! Nå skal vi regne.'); } });
app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='home'){ try{speechSynthesis.cancel()}catch(x){} confirmReset=false; view='home'; render(); }
  else if(act==='play'){ sfx.tap(); startGame(b.dataset.m); }
  else if(act==='topic'){ S.topic=b.dataset.t; save(); sfx.tap(); renderHome(); }
  else if(act==='grade'){ S.grade=+b.dataset.g; if(!GR[S.grade].regn[S.topic]) S.topic='all'; save(); sfx.tap(); renderHome(); say(`${S.grade}. trinn`); }
  else if(act==='table'){ const n=+b.dataset.n; if(S.tables.includes(n)){ if(S.tables.length>1) S.tables=S.tables.filter(x=>x!==n); } else S.tables=[...S.tables,n].sort((a,b)=>a-b); save(); sfx.tap(); renderHome(); }
  else if(act==='rate'){ S.rate=+b.dataset.r; save(); renderHome(); say('Hei! Nå skal vi regne.'); }
  else if(act==='sound'){ S.sound=!S.sound; save(); renderHome(); sfx.tap(); }
  else if(act==='testvoice'){ say('Hei! Sju pluss åtte er femten.'); }
  else if(act==='reset'){ confirmReset=true; renderHome(); }
  else if(act==='reset-no'){ confirmReset=false; renderHome(); }
  else if(act==='reset-yes'){ Object.assign(S,{stars:0,toNext:0,gifts:1,have:[],done:0,redo:[],doneG:{}}); save(); confirmReset=false; renderHome(); toast('Alt er nullstilt'); }
  else if(act==='coll'){ view='coll'; render(); }
  else if(act==='gift'){ view='gift'; render(); }
  else if(act==='tapgift'){
    giftTaps++; const box=document.getElementById('giftbox'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    tone(300+giftTaps*150,.12,'triangle'); document.querySelectorAll('#taps i').forEach((d,i)=>d.classList.toggle('on',i<giftTaps));
    say(['én','to','tre'][giftTaps-1]||'');
    if(giftTaps>=3) setTimeout(openGift,450);
  }
  else if(act==='pat'){ const d=HZ[+b.dataset.id]; trot(b.querySelector('svg')||b); sfx.clop(); say(`${d.n}. ${d.b}. ${d.h} centimeter.`); }
  else if(view==='game' && G){
    const t=G.task;
    if(act==='replay'){ say(t.speak); }
    else if(act==='tip'){ t.showTip=true; markMiss(); renderGame(); if(t.tip) say(t.tip.replace('Tips:','')); }
    else if(G.busy) return;
    else if(act==='key'){ keyPress(b.dataset.k); }
    else if(act==='pick'){
      if(b.dataset.v===t.ans){ b.classList.add('ok'); document.querySelectorAll('[data-act=pick]').forEach(x=>x.disabled=true); correct(b); }
      else { t.tries++; markMiss(); sfx.no(); b.classList.add('no'); b.disabled=true; }
    }
  }
});
document.addEventListener('keydown', e=>{
  if(view!=='game'||!G||G.task.kind!=='num') return;
  if(/^[0-9]$/.test(e.key)) keyPress(e.key); else if(e.key==='Backspace') keyPress('del'); else if(e.key==='Enter') keyPress('ok');
  else if(e.key===','||e.key==='.') keyPress(','); else if(e.key==='-') keyPress('−');
});

render();
</script>

</body></html>
